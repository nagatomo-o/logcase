<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-label="画面遷移図">
  <title>画面遷移図</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <ellipse cx="80" cy="80" rx="48" ry="24" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">LCH_B01</text>
  <text x="80" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">起動コマンド</text>
  <line x1="128" y1="80" x2="200" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="164" y="68" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">ブラウザで開く</text>

  <rect x="204" y="48" width="200" height="64" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="304" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">CSE_D01 案件一覧画面</text>
  <text x="304" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">GET /</text>

  <line x1="404" y1="80" x2="488" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="446" y="68" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">案件をクリック</text>

  <rect x="492" y="48" width="240" height="64" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="612" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">WRK_D01 案件作業画面</text>
  <text x="612" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">GET /cases/{公開識別子}</text>

  <line x1="612" y1="112" x2="612" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="148" font-family="sans-serif" font-size="11" fill="#333">CSV 書き出し</text>
  <rect x="492" y="172" width="240" height="56" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="612" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">EXP_F01 / EXP_F02</text>
  <text x="612" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">ファイル保存（画面は維持）</text>

  <line x1="492" y1="80" x2="404" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="446" y="108" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">パンくず「案件」</text>

  <line x1="304" y1="112" x2="304" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="164" font-family="sans-serif" font-size="11" fill="#333">作成・名称変更・削除は同一画面</text>
</svg>
