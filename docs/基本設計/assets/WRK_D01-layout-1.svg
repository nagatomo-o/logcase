<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-label="WRK_D01 案件作業画面レイアウト">
  <title>WRK_D01 案件作業画面</title>
  <rect x="12" y="12" width="1076" height="656" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <rect x="12" y="12" width="1076" height="44" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="28" y="40" font-family="sans-serif" font-size="13" fill="#333">ログケース　　　　／　案件　／　（案件名）　　　　　　　　　　　　127.0.0.1:8765</text>

  <rect x="12" y="56" width="1076" height="40" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="36" y="82" font-family="sans-serif" font-size="12" fill="#0b5c6e">一覧</text>
  <text x="88" y="82" font-family="sans-serif" font-size="12" fill="#333">集計</text>
  <text x="140" y="82" font-family="sans-serif" font-size="12" fill="#333">取り込み</text>
  <text x="212" y="82" font-family="sans-serif" font-size="12" fill="#333">案件情報</text>
  <text x="820" y="82" font-family="sans-serif" font-size="11" fill="#333">ファイル数　/　全行数　/　最終取り込み</text>
  <line x1="28" y1="94" x2="72" y2="94" stroke="#0b5c6e" stroke-width="2"/>

  <rect x="12" y="96" width="300" height="572" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="28" y="124" font-family="sans-serif" font-size="13" fill="#333">検索条件</text>
  <text x="28" y="152" font-family="sans-serif" font-size="12" fill="#333">一致件数 / 全行</text>
  <text x="28" y="184" font-family="sans-serif" font-size="12" fill="#333">条件（AND）　列・演算子・値</text>
  <text x="28" y="208" font-family="sans-serif" font-size="12" fill="#333">条件を追加</text>
  <text x="28" y="240" font-family="sans-serif" font-size="12" fill="#333">この条件の意味</text>
  <text x="28" y="272" font-family="sans-serif" font-size="12" fill="#333">保存した条件　呼び出し / 保存</text>
  <rect x="28" y="600" width="128" height="28" rx="3" fill="#0b5c6e" stroke="#333" stroke-width="1"/>
  <text x="92" y="619" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">条件を適用</text>
  <rect x="164" y="600" width="72" height="28" rx="3" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="200" y="619" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">解除</text>
  <text x="28" y="648" font-family="sans-serif" font-size="11" fill="#333">一致行に一括で値を設定（モーダル）</text>

  <rect x="312" y="96" width="776" height="572" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="328" y="124" font-family="sans-serif" font-size="13" fill="#333">メイン（タブで切替。対象はフィルタ一致の全行）</text>

  <rect x="328" y="144" width="744" height="112" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="344" y="168" font-family="sans-serif" font-size="12" fill="#333">一覧: 一致件数　一致行を CSV に</text>
  <text x="344" y="192" font-family="sans-serif" font-size="12" fill="#333">表: 行ID / 元ファイル / 行番号 / ログ項目 / カスタム（編集可）</text>
  <text x="344" y="216" font-family="sans-serif" font-size="12" fill="#333">横スクロール・折り返しなし。続き取り</text>
  <text x="344" y="240" font-family="sans-serif" font-size="11" fill="#333">カスタムが無いときは一括は使えない</text>

  <rect x="328" y="268" width="744" height="96" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="344" y="292" font-family="sans-serif" font-size="12" fill="#333">集計: グループ（複数可のチップ）　時間バケット n・単位</text>
  <text x="344" y="316" font-family="sans-serif" font-size="12" fill="#333">数値の個数/平均/合計　集計を実行　結果表　集計結果を CSV に</text>
  <text x="344" y="340" font-family="sans-serif" font-size="11" fill="#333">アクセス数は常に出す。時間軸が無い案件ではバケット不可</text>

  <rect x="328" y="376" width="744" height="96" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="344" y="400" font-family="sans-serif" font-size="12" fill="#333">取り込み: ファイル選択　同名追加の確認　取り込み開始</text>
  <text x="344" y="424" font-family="sans-serif" font-size="12" fill="#333">取り込み済み一覧（読んだ / 入れた / 捨てた / 重複 / 日時）</text>
  <text x="344" y="448" font-family="sans-serif" font-size="12" fill="#333">この案件の列構成（読み取り専用）</text>

  <rect x="328" y="484" width="744" height="160" rx="3" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="344" y="508" font-family="sans-serif" font-size="12" fill="#333">案件情報: 案件名 / LogFormat / 行数・ファイル / 時間軸</text>
  <text x="344" y="532" font-family="sans-serif" font-size="12" fill="#333">ログの列（識別子・型・指定子・時間軸）変更不可</text>
  <text x="344" y="556" font-family="sans-serif" font-size="12" fill="#333">カスタムフィールドの追加・削除</text>
  <text x="344" y="580" font-family="sans-serif" font-size="12" fill="#333">保存した条件の一覧</text>
  <text x="344" y="616" font-family="sans-serif" font-size="11" fill="#333">パンくず「案件」で CSE_D01 へ戻る</text>
</svg>
