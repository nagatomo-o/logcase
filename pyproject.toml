[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "access-log-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
access-log-db = "access_log_db.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
access_log_db = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
